name: CarWale
description: 'CarWale is an Indian automotive marketplace and part of CarTrade Tech
  Limited, connecting car buyers with new-car dealers and used-car sellers across
  1,500+ cities in India. The consumer platform offers new and used vehicle listings,
  accurate on-road pricing sourced directly from dealers, car valuation and sell-car
  tools, side-by-side comparisons, expert reviews and first-drive reports, and automotive
  news and video content. CarWale reports over 34 million monthly unique visitors
  and operates alongside sister brands including BikeWale, CarTrade, CarWale abSure,
  Mobility Outlook, and Adroit Auto. CarWale does not currently publish a public developer
  portal or API; this profile captures its public identity and domain-security posture.'
